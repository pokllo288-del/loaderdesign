<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foresight</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --panel: #0c0c0c;
    --line: rgba(255,255,255,.08);
    --text: #f5f5f5;
    --muted: #7a7a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- logo ---------- */
  .mark path { fill: #fff; }

  /* ---------- intro ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    transition: opacity .9s ease, filter .9s ease;
  }
  #intro.out { opacity: 0; filter: blur(10px); pointer-events: none; }

  #intro .mark { width: 110px; height: 110px; overflow: visible; }
  #intro .mark path {
    fill: transparent; stroke: #fff; stroke-width: .8;
    stroke-dasharray: 300; stroke-dashoffset: 300;
    animation: draw 1.3s cubic-bezier(.65,0,.35,1) forwards, fillIn .6s ease forwards;
  }
  #intro .mark path:nth-child(1) { animation-delay: .2s, 1.3s; }
  #intro .mark path:nth-child(2) { animation-delay: .45s, 1.45s; }
  #intro .mark { animation: glow 1s ease 1.6s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fillIn { to { fill: #fff; } }
  @keyframes glow { to { filter: drop-shadow(0 0 18px rgba(255,255,255,.35)); } }

  .word { display: flex; font-weight: 300; font-size: 22px; letter-spacing: .7em; margin-right: -.7em; }
  .word span {
    display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(10px);
    animation: letter .8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes letter { to { opacity: 1; filter: none; transform: none; } }

  .intro-bar { width: 160px; height: 1px; background: var(--line); overflow: hidden; opacity: 0; animation: fade .4s ease 2.4s forwards; }
  .intro-bar i { display: block; height: 100%; width: 0; background: #fff; animation: fill 1.2s cubic-bezier(.65,0,.35,1) 2.5s forwards; }
  @keyframes fill { to { width: 100%; } }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- loader ---------- */
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .window {
    width: 400px; max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 18px;
    opacity: 0; transform: translateY(24px) scale(.96);
  }
  .ready .window { animation: winIn .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes winIn { to { opacity: 1; transform: none; } }

  .s { opacity: 0; transform: translateY(10px); }
  .ready .s { animation: up .6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(.3s + var(--i) * .08s); }
  @keyframes up { to { opacity: 1; transform: none; } }

  .top { display: flex; justify-content: flex-end; padding: 12px 12px 0; }
  .x {
    width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--muted);
    cursor: pointer; display: grid; place-items: center; transition: background .2s, color .2s;
  }
  .x:hover { background: rgba(255,255,255,.07); color: var(--text); }

  .head { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 6px 28px 28px; }
  .head .mark { width: 54px; height: 54px; filter: drop-shadow(0 0 14px rgba(255,255,255,.2)); animation: float 5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-4px); } }
  .head h1 { font-weight: 300; font-size: 14px; letter-spacing: .6em; margin-right: -.6em; }

  .body { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 14px; }

  .game {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.02);
    transition: border-color .25s;
  }
  .game:hover { border-color: rgba(255,255,255,.18); }
  .game .n { font-weight: 500; font-size: 14px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #d4d4d4; letter-spacing: .08em; }
  .status i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,255,255,.5); }
    70% { box-shadow: 0 0 0 7px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }

  .mode {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.02);
  }
  .mode .pill {
    position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
    border-radius: 9px; background: rgba(255,255,255,.1);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .mode[data-pos="1"] .pill { transform: translateX(100%); }
  .mode button {
    position: relative; z-index: 1; border: 0; background: transparent; cursor: pointer;
    padding: 10px; color: var(--muted); font: 500 12px "Inter", sans-serif; letter-spacing: .12em;
    transition: color .25s;
  }
  .mode button:hover { color: #bdbdbd; }
  .mode button.on { color: var(--text); }

  .updates { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.02); }
  .updates .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .updates h2 { font-size: 11px; font-weight: 500; letter-spacing: .2em; color: var(--text); }
  .updates .when { font-size: 11px; color: var(--muted); }
  .updates ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .updates li { position: relative; padding-left: 16px; font-size: 12px; color: #b5b5b5; line-height: 1.5; }
  .updates li::before { content: ""; position: absolute; left: 0; top: .75em; width: 8px; height: 1px; background: var(--muted); }

  .load {
    position: relative; overflow: hidden; width: 100%;
    padding: 15px; border: 0; border-radius: 12px; cursor: pointer;
    background: #fff; color: #000;
    font: 600 12px "Inter", sans-serif; letter-spacing: .35em;
    transition: transform .2s ease, box-shadow .3s ease;
  }
  .load::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(0,0,0,.12) 50%, transparent 70%);
    transform: translateX(-100%); transition: transform .7s ease;
  }
  .load:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -6px rgba(255,255,255,.3); }
  .load:hover::before { transform: translateX(100%); }
  .load:active { transform: scale(.98); }

  .foot { text-align: center; font-size: 11px; color: #4a4a4a; padding-bottom: 18px; letter-spacing: .05em; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <!-- logo, reused below -->
  <template id="logo">
    <svg class="mark" viewBox="0 0 100 100">
      <path d="M27 16 H94 L86 29 H37.5 L24 84 H11 Z"/>
      <path d="M40 40 H76 L68 52 H37 Z"/>
    </svg>
  </template>

  <!-- INTRO -->
  <div id="intro">
    <div data-logo></div>
    <div class="word" id="word"></div>
    <div class="intro-bar"><i></i></div>
  </div>

  <!-- LOADER -->
  <div id="app">
    <div class="window">
      <div class="top">
        <button class="x" aria-label="Minimize">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8"stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="head">
        <div class="s" style="--i:0" data-logo></div>
        <h1 class="s" style="--i:1">FORESIGHT</h1>
      </div>

      <div class="body">
        <div class="game s" style="--i:2">
          <div class="n">Counter-Strike 2</div>
          <div class="status"><i></i>ONLINE</div>
        </div>
        <div class="updates s" style="--i:3">
          <div class="row">
            <h2>UPDATES</h2>
            <span class="when">Last update 10 days ago</span>
          </div>
          <ul>
            <li>Updated for the latest CS2 patch</li>
            <li>Improved kernel mode stability</li>
            <li>Faster loading</li>
          </ul>
        </div>
        <div class="mode s" style="--i:4" id="mode" data-pos="0">
          <span class="pill"></span>
          <button type="button" data-value="usermode" class="on">USERMODE</button>
          <button type="button" data-value="kernel">KERNEL</button>
        </div>
        <button class="load s" style="--i:5" id="load" type="button">LOAD</button>
      </div>

      <div class="foot s" style="--i:6">v1.0</div>
    </div>
  </div>

<script>
  // insert logo
  const tpl = document.getElementById('logo');
  document.querySelectorAll('[data-logo]').forEach(el => el.replaceWith(tpl.content.cloneNode(true)));

  // intro letters
  const word = document.getElementById('word');
  [...'FORESIGHT'].forEach((c, i) => {
    const s = document.createElement('span');
    s.textContent = c;
    s.style.animationDelay = (1.4 + i * 0.07) + 's';
    word.appendChild(s);
  });

  // intro -> loader
  setTimeout(() => {
    document.getElementById('intro').classList.add('out');
    document.body.classList.add('ready');
  }, 4000);

  // two-option switches
  function makeSwitch(el, onChange) {
    const btns = [...el.querySelectorAll('button')];
    btns.forEach((b, i) => b.addEventListener('click', () => {
      el.dataset.pos = i;
      btns.forEach(x => x.classList.toggle('on', x === b));
      onChange(b.dataset.value);
    }));
  }

  // mode switch: 'usermode' or 'kernel'
  let mode = 'usermode';
  makeSwitch(document.getElementById('mode'), v => { mode = v; });

  // load button: does nothing for now
  document.getElementById('load').addEventListener('click', () => {});

</script>
</body>
</html>
